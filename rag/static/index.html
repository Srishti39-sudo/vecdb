<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vecdb RAG</title>
<style>
  :root {
    --bg: #f7f8fb; --panel: #ffffff; --ink: #1d2330; --muted: #5b6475; --line: #d9dee8;
    --accent: #2f5bd3; --accent-ink: #ffffff; --tint: #eef2fc; --warn: #9a5b00; --warn-bg: #fdf6ea;
    --ok: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1a1f29; --ink: #e6e9ef; --muted: #9aa3b5; --line: #2c3442;
      --accent: #7c9cff; --accent-ink: #0d1020; --tint: #222a3a; --warn: #e3b25e; --warn-bg: #2d2617;
      --ok: #6fcf9d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
         border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 4px; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
  .row > * { flex: 1 1 160px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); flex: 0 0 auto; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  #answer { white-space: pre-wrap; font-size: 16px; min-height: 1.5em; }
  .cite { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 6px; margin: 0 1px;
          border-radius: 5px; background: var(--tint); color: var(--accent); cursor: pointer; border: 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--tint); color: var(--ok); }
  .src { border-top: 1px solid var(--line); padding: 10px 0; }
  .src:first-child { border-top: 0; }
  .src.hl { background: var(--tint); margin: 0 -16px; padding: 10px 16px; }
  .src h3 { font-size: 14px; margin: 0 0 4px; }
  .src p { margin: 0; color: var(--muted); font-size: 14px; }
  .scores { font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; font-weight: 600; }
  .hidden { display: none; }
  #err { color: var(--warn); margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>vecdb RAG</h1>
  <p class="sub">Answers come only from the indexed documents, with numbered citations. Off-topic questions are declined.</p>

  <div class="panel">
    <label for="q">Question</label>
    <textarea id="q" placeholder="Why does the brain need sleep?"></textarea>
    <div class="row">
      <div><label for="mode">Search</label>
        <select id="mode"><option value="hybrid">hybrid</option><option value="vector">vector</option><option value="bm25">keyword (BM25)</option></select></div>
      <div><label for="docs">Only these documents (ids, comma separated)</label><input id="docs" placeholder="all documents"></div>
      <button id="ask">Ask</button>
    </div>
    <div id="err"></div>
  </div>

  <div class="panel hidden" id="result">
    <div id="answer"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="panel hidden" id="sources-panel">
    <label>Retrieved sources</label>
    <div id="sources"></div>
  </div>

  <div class="panel">
    <details>
      <summary>Settings and documents</summary>
      <div class="row">
        <div><label for="key">API key</label><input id="key" type="password" placeholder="X-API-Key (if the server requires one)"></div>
      </div>
      <div class="row">
        <div><label for="file">Upload a document (.md .txt .pdf .html)</label><input id="file" type="file" accept=".md,.markdown,.txt,.pdf,.html,.htm"></div>
        <div><label for="tags">Tags</label><input id="tags" placeholder="e.g. neuroscience"></div>
        <button id="upload" class="ghost">Upload</button>
      </div>
      <div class="meta" id="docs-list"></div>
    </details>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
$("key").value = store.get("rag-key");
$("key").addEventListener("change", () => { store.set("rag-key", $("key").value); loadDocs(); });

function headers(json = true) {
  const h = json ? { "Content-Type": "application/json" } : {};
  if ($("key").value) h["X-API-Key"] = $("key").value;
  return h;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

let sources = [];
function renderAnswer(text) {
  // turn [n] into clickable chips that highlight the matching source
  $("answer").innerHTML = esc(text).replace(/\[(\d+)\]/g, (m, n) =>
    Number(n) >= 1 && Number(n) <= sources.length ? `<button class="cite" data-n="${n}">${n}</button>` : m);
}
function renderSources(list) {
  sources = list;
  $("sources-panel").classList.toggle("hidden", !list.length);
  $("sources").innerHTML = list.map((s, i) => `
    <div class="src" id="src-${i + 1}">
      <h3>[${i + 1}] ${esc(s.title)}${s.section ? " › " + esc(s.section) : ""}${s.page ? " (p. " + s.page + ")" : ""}</h3>
      <p>${esc(s.text)}</p>
      <div class="scores">cosine ${s.vector_score} · vector rank ${s.vector_rank ?? "–"} · keyword rank ${s.bm25_rank ?? "–"} · ${esc(s.doc_id)}</div>
    </div>`).join("");
}
$("answer").addEventListener("click", (e) => {
  const n = e.target.dataset && e.target.dataset.n;
  if (!n) return;
  document.querySelectorAll(".src.hl").forEach((el) => el.classList.remove("hl"));
  const el = $("src-" + n);
  el.classList.add("hl");
  el.scrollIntoView({ behavior: "smooth", block: "center" });
});

async function ask() {
  const question = $("q").value.trim();
  if (!question) return;
  $("err").textContent = ""; $("ask").disabled = true;
  $("result").classList.remove("hidden"); $("answer").textContent = ""; $("meta").textContent = "";
  renderSources([]);
  const body = { question, mode: $("mode").value };
  const docs = $("docs").value.split(",").map((s) => s.trim()).filter(Boolean);
  if (docs.length) body.doc_ids = docs;
  let text = "";
  try {
    const r = await fetch("/v1/query/stream", { method: "POST", headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {             // one Server-Sent Event per blank line
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "null");
        if (event === "sources") renderSources(data);
        else if (event === "token") { text += data; renderAnswer(text); }
        else if (event === "error") throw new Error(data.detail);
        else if (event === "done") {
          renderAnswer(data.answer || text);
          if (data.abstained && data.reason !== "model_declined") {
            // nothing relevant was found: the nearest passages are noise, so don't present them as sources
            $("sources-panel").classList.add("hidden");
          }
          const why = { below_floor: "nothing in the documents is relevant", no_results: "no documents match",
                        model_declined: "the sources don't answer this" };
          const badge = data.abstained
            ? `<span class="badge warn">declined: ${esc(why[data.reason] || data.reason)}</span>`
            : data.grounded ? `<span class="badge ok">cited ${data.citations.length} source(s)</span>`
                            : `<span class="badge warn">no valid citation</span>`;
          $("meta").innerHTML = `${badge} &nbsp; ${data.timings_ms.total} ms`;
        }
      }
    }
  } catch (e) {
    $("err").textContent = e.message;
  } finally {
    $("ask").disabled = false;
  }
}
$("ask").addEventListener("click", ask);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });

async function loadDocs() {
  try {
    const r = await fetch("/v1/documents", { headers: headers() });
    if (!r.ok) { $("docs-list").textContent = r.status === 401 ? "Enter the API key to list documents." : r.statusText; return; }
    const { documents } = await r.json();
    $("docs-list").innerHTML = documents.length
      ? documents.map((d) => `<div><b>${esc(d.id)}</b> · ${esc(d.title)} · ${d.chunks} chunks</div>`).join("")
      : "No documents yet.";
  } catch (e) { $("docs-list").textContent = e.message; }
}
$("upload").addEventListener("click", async () => {
  const f = $("file").files[0];
  if (!f) return;
  const form = new FormData();
  form.append("file", f);
  form.append("tags", $("tags").value);
  $("upload").disabled = true;
  try {
    const r = await fetch("/v1/documents/upload", { method: "POST", headers: headers(false), body: form });
    const out = await r.json();
    if (!r.ok) throw new Error(out.detail || r.statusText);
    $("docs-list").textContent = `${out.status}: ${out.id} (${out.chunks} chunks)`;
    setTimeout(loadDocs, 800);
  } catch (e) { $("docs-list").textContent = e.message; }
  finally { $("upload").disabled = false; }
});
loadDocs();
const preset = new URLSearchParams(location.search).get("q");   // shareable link: /?q=question
if (preset) { $("q").value = preset; ask(); }
</script>
</body>
</html>
